[project]
name = "optimalinterp"
version = "0.1.0"
description = "Package for creating optimal interpolants"
readme = "README.md"
authors = [
    { name = "Daniel Sharp", email = "dannys4@mit.edu" },
    { name = "Panos Tsimpos", email = "ptsimpos@mit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8.1",
    "jaxtyping>=0.3.3",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
]

[project.scripts]
optimalinterp = "optimalinterp:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
